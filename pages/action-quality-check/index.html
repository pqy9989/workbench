<!doctype html>
<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="../../components/platform-sidebar/platform-sidebar.css?v=transparent-secondary-selection-1" />
  <script src="../../components/platform-sidebar/platform-sidebar.js?v=collapsed-width-80-1" defer></script>
  <link rel="stylesheet" href="../../components/task-header/task-header.css?v=compact-task-name-1" />
  <script src="../../components/task-header/task-header.js?v=countdown-mmss-1" defer></script>
  <link rel="stylesheet" href="../../components/media-viewer/media-viewer.css" />
  <script src="../../components/media-viewer/media-viewer.js" defer></script>
  <link rel="stylesheet" href="../../components/annotation-timeline/annotation-timeline.css?v=linked-acceptance-items-1" />
  <script src="../../components/annotation-timeline/annotation-timeline.js" defer></script>
  <link rel="stylesheet" href="../../components/fill-area/fill-area.css?v=action-row-keyboard-selected-1" />

  <link rel="stylesheet" href="./page.css?v=shortcut-dialog-layer-1" />
</head>
<body data-page-id="action-annotation" data-view="task-list" data-theme="light">
  <div class="page-shell">
    <aside class="page-sidebar" data-block="platform-sidebar">
      <platform-sidebar></platform-sidebar>
    </aside>

    <main class="page-workspace">
      <section class="task-list-view" aria-label="采集任务列表">
        <header class="task-list-view__header"><h1>采集任务列表</h1></header>
        <div class="task-list-view__main">
          <div class="task-list-view__tabs" role="tablist"><button class="is-active" type="button" role="tab" aria-selected="true">任务池</button><button type="button" role="tab" aria-selected="false">待办项</button></div>
          <div class="task-list-view__filters">
            <label><span>ID搜索</span><input type="search" placeholder="请输入ID" /></label>
            <label><span>序列号</span><button type="button">请选择设备序列号<img src="./assets/icon-list-chevron.svg" alt="" /></button></label>
            <label><span>ID搜索</span><button type="button">请选择操作类型/操作人<img src="./assets/icon-list-chevron.svg" alt="" /></button></label>
            <button class="task-list-view__refresh" type="button" aria-label="刷新列表"><img src="./assets/icon-list-refresh.svg" alt="" /></button>
          </div>
          <div class="task-list-view__table-wrap">
            <table class="task-list-view__table">
              <thead><tr><th>流程</th><th>节点</th><th>待领取</th><th>处理中</th><th>最长滞留</th><th>优先级分布</th><th>操作</th></tr></thead>
              <tbody>
                <tr><td>端到端切分标注流程</td><td><span class="task-list-view__tag">供应商抽检</span></td><td>243</td><td>39</td><td>3.4小时</td><td><span class="task-list-view__priority">9级 164·7级36·6级42</span></td><td><button class="task-list-view__start" type="button">开始处理</button><button class="task-list-view__more" type="button">更多操作</button></td></tr>
                <tr><td>端到端切分标注流程</td><td><span class="task-list-view__tag">供应商抽检</span></td><td>243</td><td>39</td><td>3.4小时</td><td><span class="task-list-view__priority">9级 164·7级36·6级42</span></td><td><button class="task-list-view__start" type="button">开始处理</button><button class="task-list-view__more" type="button">更多操作</button></td></tr>
                <tr><td>端到端切分标注流程</td><td><span class="task-list-view__tag">供应商抽检</span></td><td>243</td><td>39</td><td>3.4小时</td><td><span class="task-list-view__priority">9级 164·7级36·6级42</span></td><td><button class="task-list-view__start" type="button">开始处理</button><button class="task-list-view__more" type="button">更多操作</button></td></tr>
                <tr><td>端到端切分标注流程</td><td><span class="task-list-view__tag">供应商抽检</span></td><td>243</td><td>39</td><td>3.4小时</td><td><span class="task-list-view__priority">9级 164·7级36·6级42</span></td><td><button class="task-list-view__start" type="button">开始处理</button><button class="task-list-view__more" type="button">更多操作</button></td></tr>
              </tbody>
            </table>
          </div>
        </div>
        <footer class="task-list-view__pagination"><button type="button">10条/页 <img src="./assets/icon-list-chevron.svg" alt="" /></button><button class="is-current" type="button">1</button><button type="button">2</button><button type="button">3</button><button type="button">4</button><button type="button">5</button><span>...</span><button type="button">105</button><button type="button" aria-label="下一页"><img class="is-next" src="./assets/icon-page-chevron.svg" alt="" /></button><span class="task-list-view__page-input"></span><button type="button">go</button></footer>
      </section>

      <nav class="page-tabs" data-page-tabs aria-label="页面切换"></nav>

      <header class="page-header" data-block="task-header">
        <task-header data-variant="quality-check" aria-label="任务信息-质检"></task-header>
      </header>

      <div class="page-content">
        <section class="media-block" data-block="media-viewer">
          <div class="media-slot">
            <media-viewer data-variant="one-large-two-stacked" aria-label="视频区-左一右二"></media-viewer>
          </div>
        </section>

        <section class="playback-block" data-block="playback-controls">
          <annotation-timeline data-variant="manual-quality-check" aria-label="人工质检-动作质检"></annotation-timeline>
        </section>

        <aside class="fill-block" data-block="fill-area">
          <button class="fill-resizer" type="button" role="separator" aria-label="调整右侧操作区宽度" aria-orientation="vertical" aria-valuemin="360" aria-valuenow="450"></button>
          <div class="fill-slot">
            <fill-area data-variant="manual-quality-check" aria-label="动作质检"></fill-area>
          </div>
        </aside>
      </div>
    </main>
  </div>
  <script src="../page-tabs.js?v=live-workbench-mode-1" defer></script>
  <script src="./page.js?v=action-row-keyboard-selected-1" defer></script>
</body>
</html>
