<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Button 按钮组件</title>
  <link rel="stylesheet" href="../component-preview.css">
  <link rel="stylesheet" href="./button.css">
  <script src="./button.js" defer></script>
  <style>.button-states{width:100%;border-collapse:collapse;text-align:left}.button-states th,.button-states td{padding:12px;border-bottom:1px solid #e2e9ee}.button-states th{font-size:13px;color:#6b8593}.button-state-scroll{overflow-x:auto}</style>
<style>.button-type-preview{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}.button-type-preview>div{display:flex;flex-direction:column;align-items:flex-start;gap:16px}.button-type-preview h3{margin:16px 0 0}</style>
</head>
<body class="component-preview">
  <main class="component-gallery">
    <header class="component-gallery__header"><h1>Button 按钮</h1></header>
    <section class="component-gallery__group"><h2>按钮类型预览</h2><div class="button-type-preview"><div><h3>主按钮</h3><text-button variant="primary">保存</text-button><text-button variant="primary" icon="save">保存</text-button></div><div><h3>次按钮</h3><text-button variant="secondary">新建</text-button><text-button variant="secondary" icon="plus">新建</text-button></div><div><h3>描边按钮</h3><text-button variant="outline">取消</text-button><text-button variant="outline" icon="close">取消</text-button></div><div><h3>文字按钮</h3><text-button variant="text">查看详情</text-button><text-button variant="text" icon="eye">查看详情</text-button></div><div><h3>危险按钮</h3><text-button variant="danger">删除</text-button><text-button variant="danger" icon="delete">删除</text-button></div></div></section>
    <section class="component-gallery__group"><h2>纯文字按钮变体</h2><div class="button-state-scroll"><table class="button-states"><thead><tr><th>变体</th><th>默认</th><th>悬浮</th><th>按下</th><th>禁用</th></tr></thead><tbody id="button-variants"></tbody></table></div></section>
    <section class="component-gallery__group"><h2>图标文字按钮变体</h2><div class="button-state-scroll"><table class="button-states"><thead><tr><th>变体</th><th>默认</th><th>悬浮</th><th>按下</th><th>禁用</th></tr></thead><tbody id="icon-button-variants"></tbody></table></div></section>
  </main>
  <script>
    const variants = [['primary','主按钮','保存'],['secondary','次按钮','新建'],['outline','描边按钮','取消'],['text','文字按钮','查看详情'],['danger','危险按钮','删除']];
    const buttonIcons = ['save','plus','close','eye','delete'];
    document.getElementById('icon-button-variants').innerHTML = variants.map(([variant,name,label],index) => `<tr><th>${name}</th>${['default','hover','active','disabled'].map(state => `<td><text-button variant="${variant}" icon="${buttonIcons[index]}" ${state === 'disabled' ? 'disabled' : `data-preview-state="${state}"`}>${label}</text-button></td>`).join('')}</tr>`).join('');
    document.getElementById('button-variants').innerHTML = variants.map(([variant,name,label]) => `<tr><th>${name}</th>${['default','hover','active','disabled'].map(state => `<td><text-button variant="${variant}" ${state === 'disabled' ? 'disabled' : `data-preview-state="${state}"`}>${label}</text-button></td>`).join('')}</tr>`).join('');
  </script>
</body>
</html>
