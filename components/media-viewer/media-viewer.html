<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>视频区组件</title>
  <link rel="stylesheet" href="./media-viewer.css" />
</head>
<body>
  <main class="media-viewer-preview">
    <h2 class="media-viewer-preview__title">1. 视频区-三格</h2>

    <section class="media-viewer" data-component="media-viewer" data-variant="three-equal-feeds" aria-label="视频区-三格">
      <div class="media-viewer__grid">
        <figure class="media-viewer__feed media-viewer__feed--primary">
          <img class="media-viewer__image" src="./assets/camera-head.png" alt="头部视角视频画面" />
          <figcaption class="media-viewer__label">
            <span>头部视角</span>
            <button class="media-viewer__fullscreen" type="button" aria-label="全屏查看头部视角" title="全屏">
              <span aria-hidden="true">⛶</span>
            </button>
          </figcaption>
        </figure>

        <figure class="media-viewer__feed">
          <img class="media-viewer__image" src="./assets/camera-left-arm.png" alt="左臂视角视频画面" />
          <figcaption class="media-viewer__label">
            <span>左臂视角</span>
            <button class="media-viewer__fullscreen" type="button" aria-label="全屏查看左臂视角" title="全屏">
              <span aria-hidden="true">⛶</span>
            </button>
          </figcaption>
        </figure>

        <figure class="media-viewer__feed">
          <img class="media-viewer__image" src="./assets/camera-right-arm.png" alt="右臂视角视频画面" />
          <figcaption class="media-viewer__label">
            <span>右臂视角</span>
            <button class="media-viewer__fullscreen" type="button" aria-label="全屏查看右臂视角" title="全屏">
              <span aria-hidden="true">⛶</span>
            </button>
          </figcaption>
        </figure>
      </div>
    </section>

    <h2 class="media-viewer-preview__title">2. 视频区-四格</h2>

    <section class="media-viewer" data-component="media-viewer" data-variant="four-equal-feeds" aria-label="视频区-四格">
      <div class="media-viewer__grid">
        <figure class="media-viewer__feed">
          <img class="media-viewer__image" src="./assets/camera-head.png" alt="左臂视角视频画面" />
          <figcaption class="media-viewer__label">
            <span>左臂视角</span>
            <button class="media-viewer__fullscreen" type="button" aria-label="全屏查看左臂视角" title="全屏"><span aria-hidden="true">⛶</span></button>
          </figcaption>
        </figure>

        <figure class="media-viewer__feed">
          <img class="media-viewer__image" src="./assets/camera-head.png" alt="右臂视角视频画面" />
          <figcaption class="media-viewer__label">
            <span>右臂视角</span>
            <button class="media-viewer__fullscreen" type="button" aria-label="全屏查看右臂视角" title="全屏"><span aria-hidden="true">⛶</span></button>
          </figcaption>
        </figure>

        <figure class="media-viewer__feed">
          <img class="media-viewer__image" src="./assets/camera-left-arm.png" alt="头部视角视频画面" />
          <figcaption class="media-viewer__label">
            <span>头部视角</span>
            <button class="media-viewer__fullscreen" type="button" aria-label="全屏查看头部视角" title="全屏"><span aria-hidden="true">⛶</span></button>
          </figcaption>
        </figure>

        <figure class="media-viewer__feed">
          <img class="media-viewer__image" src="./assets/camera-right-arm.png" alt="头部结束帧画面" />
          <figcaption class="media-viewer__label media-viewer__label--wide">
            <span>头部结束帧</span>
            <button class="media-viewer__fullscreen" type="button" aria-label="全屏查看头部结束帧" title="全屏"><span aria-hidden="true">⛶</span></button>
          </figcaption>
        </figure>
      </div>
    </section>
  </main>

  <script src="./media-viewer.js"></script>
</body>
</html>
