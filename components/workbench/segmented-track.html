<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>工作台组件</title>
  <script>
    (() => {
      let theme = 'light';
      try { theme = localStorage.getItem('workbench-component-theme') || theme; } catch (_) {}
      const dark = theme === 'dark';
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.classList.toggle('component-dark', dark);
    })();
  </script>
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="../component-preview.css">
  <link rel="stylesheet" href="./segmented-track.css">
  <script src="./segmented-track.js" defer></script>
</head>
<body class="component-preview">
  <main class="component-gallery">
    <header class="component-gallery__header">
      <h1>工作台</h1>
      <p>标注工作台相关组件</p>
      <button class="component-theme-toggle" type="button" data-component-theme aria-label="切换深浅主题" aria-pressed="false"><span></span></button>
    </header>
    <section class="component-gallery__group">
      <h2>任务信息栏</h2>
      <div class="component-gallery__stage component-gallery__stage--track component-gallery__stage--unframed"><workbench-task-header></workbench-task-header></div>
    </section>
    <section class="component-gallery__group">
      <h2>采集指令栏</h2>
      <div class="component-gallery__stage component-gallery__stage--track component-gallery__stage--unframed"><workbench-instruction></workbench-instruction></div>
    </section>
    <section class="component-gallery__group">
      <h2>媒体预览</h2>
      <div class="component-gallery__variants">
        <div class="component-gallery__variant">
          <h3>默认</h3>
          <div class="component-gallery__stage component-gallery__stage--track component-gallery__stage--unframed"><workbench-media-viewer></workbench-media-viewer></div>
        </div>
        <div class="component-gallery__variant">
          <h3>左二右一 · 3:2</h3>
          <div class="component-gallery__stage component-gallery__stage--track component-gallery__stage--unframed"><workbench-media-viewer variant="three-panel"></workbench-media-viewer></div>
        </div>
      </div>
    </section>
    <section class="component-gallery__group component-gallery__group--overflow">
      <h2>片段编辑器</h2>
      <div class="component-gallery__variants">
        <div class="component-gallery__variant">
          <h3>语义标注</h3>
          <div class="component-gallery__stage component-gallery__stage--track component-gallery__stage--unframed"><workbench-segment-editor></workbench-segment-editor></div>
        </div>
        <div class="component-gallery__variant">
          <h3>质检</h3>
          <div class="component-gallery__stage component-gallery__stage--track component-gallery__stage--unframed"><workbench-segment-editor variant="variant-2"></workbench-segment-editor></div>
        </div>
        <div class="component-gallery__variant">
          <h3>动作标注</h3>
          <div class="component-gallery__stage component-gallery__stage--track component-gallery__stage--unframed"><workbench-segment-editor variant="variant-3"></workbench-segment-editor></div>
        </div>
      </div>
    </section>
    <section class="component-gallery__group">
      <h2>片段列表区</h2>
      <div class="component-gallery__variants">
        <div class="component-gallery__variant"><h3>语义标注</h3><div class="component-gallery__stage component-gallery__stage--track component-gallery__stage--unframed component-gallery__stage--review-panel"><workbench-segment-list-panel variant="segments"></workbench-segment-list-panel></div></div>
        <div class="component-gallery__variant"><h3>动作标注</h3><div class="component-gallery__stage component-gallery__stage--track component-gallery__stage--unframed component-gallery__stage--review-panel"><workbench-quality-list title="标注列表" rows="6"></workbench-quality-list></div></div>
        <div class="component-gallery__variant"><h3>质检</h3><div class="component-gallery__stage component-gallery__stage--track component-gallery__stage--unframed component-gallery__stage--review-panel"><workbench-annotation-list title="质检列表" rows="6"></workbench-annotation-list></div></div>
        <div class="component-gallery__variant"><h3>日志</h3><div class="component-gallery__stage component-gallery__stage--track component-gallery__stage--unframed component-gallery__stage--review-panel"><workbench-segment-list-panel variant="log"></workbench-segment-list-panel></div></div>
        <div class="component-gallery__variant"><h3>基本信息</h3><div class="component-gallery__stage component-gallery__stage--track component-gallery__stage--unframed component-gallery__stage--review-panel"><workbench-segment-list-panel variant="info"></workbench-segment-list-panel></div></div>
      </div>
    </section>
    <section class="component-gallery__group">
      <h2>片段列表 Tab</h2>
      <div class="component-gallery__stage component-gallery__stage--track component-gallery__stage--unframed component-gallery__stage--review-tabs"><workbench-segment-tabs active="segments"></workbench-segment-tabs></div>
    </section>
    <section class="component-gallery__group">
      <h2>质检结论</h2>
      <div class="component-gallery__stage component-gallery__stage--track component-gallery__stage--unframed component-gallery__stage--review-panel"><workbench-quality-conclusion></workbench-quality-conclusion></div>
    </section>
    <section class="component-gallery__group">
      <h2>底部操作栏</h2>
      <div class="component-gallery__stage component-gallery__stage--track component-gallery__stage--unframed component-gallery__stage--review-panel"><workbench-footer-actions></workbench-footer-actions></div>
    </section>
    <section class="component-gallery__group">
      <h2>时间刻度</h2>
      <div class="component-gallery__stage component-gallery__stage--track"><div class="segmented-timeline segmented-timeline--sample"><div class="segmented-timeline__body"><timeline-time-scale></timeline-time-scale></div></div></div>
    </section>
    <section class="component-gallery__group">
      <h2>范围选择</h2>
      <div class="component-gallery__variants">
        <div class="component-gallery__variant">
          <h3>默认</h3>
          <div class="component-gallery__stage component-gallery__stage--track"><div class="segmented-timeline segmented-timeline--sample segmented-timeline--range-sample"><div class="segmented-timeline__body"><timeline-range-selector></timeline-range-selector></div></div></div>
        </div>
        <div class="component-gallery__variant">
          <h3>变体 2 · 选取与定位标记</h3>
          <div class="component-gallery__stage component-gallery__stage--track"><div class="segmented-timeline segmented-timeline--sample segmented-timeline--range-sample"><div class="segmented-timeline__body"><timeline-range-selector variant="marked"></timeline-range-selector></div></div></div>
        </div>
      </div>
    </section>
    <section class="component-gallery__group">
      <h2>动作标注轨道</h2>
      <div class="component-gallery__stage component-gallery__stage--track"><div class="segmented-timeline segmented-timeline--sample segmented-timeline--row-sample"><div class="segmented-timeline__body"><annotation-segment-row label="14"></annotation-segment-row><annotation-base-row label="1"></annotation-base-row></div></div></div>
    </section>
    <section class="component-gallery__group">
      <h2>播放与工具栏</h2>
      <div class="component-gallery__stage component-gallery__stage--track"><div class="segmented-timeline segmented-timeline--sample"><timeline-controls></timeline-controls></div></div>
    </section>
    <section class="component-gallery__group">
      <h2>语义标注</h2>
      <div class="component-gallery__stage component-gallery__stage--track">
        <semantic-annotation-track label="14" position="19"></semantic-annotation-track>
      </div>
      <h2 class="track-gallery-quality-title">动作标注</h2>
      <div class="component-gallery__stage component-gallery__stage--track">
        <action-annotation-track label="14" position="19"></action-annotation-track>
      </div>
      <h2 class="track-gallery-quality-title">质检</h2>
      <div class="component-gallery__stage component-gallery__stage--track">
        <workbench-quality-track></workbench-quality-track>
      </div>
      <h3 class="segment-color-palette__title">连续色值</h3>
      <segment-color-palette count="50"></segment-color-palette>
    </section>
  </main>
  <script src="../component-preview.js"></script>
</body>
</html>
